name: Auto-format Python files after PR merge

permissions:
  contents: write
  pull-requests: write

on:
  push:
    branches:
      - main
      - master  # in case main branch is called master

jobs:
  auto-format:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history to compare with previous commit
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' 

      - name: Install formatting tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff isort autoflake

      - name: Get changed Python files
        id: changed-files
        run: |
          # Get the list of changed Python files from the last commit
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD -- '*.py' | tr '\n' ' ')
          echo "changed_files=$CHANGED_FILES" >> $GITHUB_OUTPUT
          echo "Changed Python files: $CHANGED_FILES"

      - name: Format Python files
        if: steps.changed-files.outputs.changed_files != ''
        run: |
          CHANGED_FILES="${{ steps.changed-files.outputs.changed_files }}"
          
          if [ -n "$CHANGED_FILES" ]; then
            echo "Formatting files: $CHANGED_FILES"
            
            # Remove unused imports with autoflake
            echo "Running autoflake..."
            autoflake --remove-all-unused-imports --in-place $CHANGED_FILES
            
            # Sort imports with isort
            echo "Running isort..."
            isort $CHANGED_FILES
            
            # Format code with ruff
            echo "Running ruff format..."
            ruff format $CHANGED_FILES
            
            echo "Formatting completed"
          else
            echo "No Python files changed"
          fi

      - name: Check for changes
        id: verify-changed-files
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changes=true" >> $GITHUB_OUTPUT
            echo "Files were modified by formatting"
          else
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "No files were modified by formatting"
          fi

      - name: Commit and push changes
        if: steps.verify-changed-files.outputs.changes == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "Auto-format Python files after PR merge [skip ci]"
          git push 