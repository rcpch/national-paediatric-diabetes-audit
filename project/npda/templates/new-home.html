{% extends "base.html" %}
{% load static %}
{% load npda_tags %}
{% block content %}
  <div class="text-center my-4">
    <h1 class="text-xl">
      {{selected_audit_period_display_name}}
      <br />
      Select your paediatric diabetes unit
    </h1>
  </div>
  <div class="flex flex-row flex-wrap justify-center gap-4 p-4">
    {% for pdu in pdu_choices %}
      <div class="card bg-base-100 w-96 shadow-xl">
        <div class="card-body">
          <h2 class="card-title">{{pdu.0}}</h2>
          <p>{{pdu.1}}</p>
          <div class="card-actions justify-end">
            <div>
              <a class="btn bg-rcpch_pink text-white" href="{% url 'pdu-patients' audit_period=audit_period_slug pz_code=pdu.0 %}">
                Patient data
              </a>
            </div>
            <div>
              <a class="btn btn-info" href="{% url 'pdu-dashboard' audit_period=audit_period_slug pz_code=pdu.0 %}">
                Unit Report
              </a>
              <a class="btn btn-info" href="{% url 'pdu-patient-report' audit_period=audit_period_slug pz_code=pdu.0 %}">
                Patient Report
              </a>
            </div>
          </div>
        </div>
      </div>
    {% endfor %}
  </div>
{% endblock %}
