{% extends "dashboard/components/bases/base_secondary_card.html" %}
{% load npda_tags %}
{% block card_title %}
    Hospital Admissions
    <span class="text-rcpch_pink tooltip"
          data-tip="Total admissions split by relationship to diagnosis: admissions outside +/- 10 days of diagnosis, and DKA admissions within that time"><i class="fa-solid fa-chart-line"></i></span>
{% endblock %}
{% block card_content %}
    <div hx-get="{% data_url 'pdu-get-new-admissions-partial' %}"
         hx-trigger="load"
         hx-swap="innerHTML"
         _="on htmx:afterSwap remove #loading-spinner-new-admissions-card">
    </div>
    <div id="loading-spinner-new-admissions-card"
         class="loading loading-spinner text-rcpch_dark_blue flex flex-grow-1 justify-center items-center h-full w-1/5 mx-auto bg-center">
    </div>
{% endblock %}
