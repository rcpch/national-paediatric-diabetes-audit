{% extends 'dashboard/components/bases/base_card.html' %}
{% load npda_tags %}
{% block card_title %}Age and sex{% endblock card_title %}
{% block card_body %}
  <div hx-get="{% data_url 'pdu-patient-ages' %}"
       hx-trigger="load"
       hx-swap="innerHTML"
       hx-target="#patient_ages"
       _="on htmx:afterRequest remove #loading-spinner-patient-ages">
  </div>
  <div id="patient_ages" class="w-full"></div>
  {% include 'dashboard/loading_spinner.html' with spinner_id="loading-spinner-patient-ages" %}
{% endblock card_body %}
