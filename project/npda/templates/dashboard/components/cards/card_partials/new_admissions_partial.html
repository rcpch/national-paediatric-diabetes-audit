{% load npda_tags %}
<div class="flex items-center justify-between w-full gap-2">
  <div class="flex flex-col items-center">
    <span class="text-xl font-bold text-rcpch_dark_blue">{{ n_admissions_outside_dx }}</span>
    <span class="text-xs text-rcpch_pink tooltip"
          data-tip="Admissions not associated with diagnosis: admissions not within +/- 10 days of diagnosis, this audit year">outside dx <i class="fa fa-circle-question"></i></span>
  </div>
  <div class="flex flex-col items-center">
    <span class="text-xl font-bold text-rcpch_dark_blue">{{ n_dka_admissions_at_dx }}</span>
    <span class="text-xs text-rcpch_pink tooltip"
          data-tip="DKA admissions within +/- 10 days of diagnosis, this audit year">dka at dx <i class="fa fa-circle-question"></i></span>
  </div>
</div>
