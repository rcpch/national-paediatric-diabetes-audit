{% comment %}
Single headline number. The value is loaded into card_content by HTMX.
{% endcomment %}
<div class="card bg-base-100 border border-rcpch_light_grey rounded-md h-full">
  <div class="card-body p-4 gap-2">
    <div class="flex items-start justify-between gap-1">
      <h3 class="text-xs font-semibold text-rcpch_charcoal leading-tight">
        {% block card_title %}{% endblock card_title %}
      </h3>
      <div class="flex items-center gap-1 -mt-1 shrink-0">
        {% block card_actions %}{% endblock card_actions %}
      </div>
    </div>
    <div class="flex items-baseline gap-2 mt-auto">
      {% block card_content %}{% endblock card_content %}
    </div>
  </div>
</div>
