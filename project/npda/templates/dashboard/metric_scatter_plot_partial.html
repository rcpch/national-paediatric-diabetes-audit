<p class="grow-0 text-xs font-semibold text-rcpch_charcoal mb-2">
  {{ chart_title }}
  <span class="tooltip text-rcpch_pink" data-tip="{{ tooltip_text }}"><i class="fa-solid fa-circle-question"></i></span>
</p>
{% if error %}
  <div class="alert alert-danger">
    <i class="fa-solid fa-person-circle-exclamation"></i> {{ error }}
  </div>
{% elif chart_html %}
  {{ chart_html|safe }}
{% endif %}
