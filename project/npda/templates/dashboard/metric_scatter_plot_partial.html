<h2 class="card-title text-sm text-center font-bold mb-5 text-rcpch_dark_blue">
  {{ chart_title }}<span class="text-rcpch_pink tooltip" data-tip="{{ tooltip_text }}"><i class="fa-solid fa-chart-line"></i></span>
</h2>
{% if error %}
  <div class="alert alert-danger">
    <i class="fa-solid fa-person-circle-exclamation"></i> {{ error }}
  </div>
{% elif chart_html %}
  {{ chart_html|safe }}
{% endif %}
