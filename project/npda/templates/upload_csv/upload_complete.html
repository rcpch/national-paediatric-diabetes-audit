<h1 class="text-4xl font-bold text-center mb-5">Upload Complete</h1>
<div class="mb-10 text-4xl font-bold text-center font-montserrat font-semibold">
  Upload completed successfully!
</div>
<div class="flex justify-center items-center mb-10">
  <i class="fa-solid fa-circle-check text-rcpch_light_blue"
     style="font-size: 8rem"></i>
</div>
<div class="text-3xl ml-5 font-montserrat">
  <b>{{ total_patients }}</b> patients in <b>{{ total_rows }}</b> rows have been successfully uploaded, processed and saved in NPDA.
</div>
<div class="flex justify-center text-center font-montserrat text-3xl mt-5">
  Your orginal CSV has been archived and can be downloaded from the <a href="{% url 'submissions' %}"class="text-rcpch_light_blue underline">
  &nbsp;Submissions&nbsp;</a>page.
</div>
<button class="btn rcpch-light-blue-btn mt-5"
        onclick="window.location.href='{% url 'patients' %}'">
  View Patients
</button>
