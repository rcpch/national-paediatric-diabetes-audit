<span class="tooltip tooltip-right block flex flex-row"
      data-tip="View patient's visits">
  <a href="{% url 'patient_visits' patient_pk %}"
     class="block w-full h-full">
    {{ patient_identifier }}
    <i class="fa-solid fa-arrow-up-right-from-square text-rcpch_strong_blue"></i>
  </a>
  {% if not is_complete_year_of_care %}
    <div class="tooltip tooltip-right "
         data-tip="Patient has not completed year of care">
      <i class="fa-solid fa-calendar-days text-rcpch_orange"></i>
    </div>
  {% endif %}
</span>
