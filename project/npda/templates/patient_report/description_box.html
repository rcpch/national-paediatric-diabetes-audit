<!-- COLLAPSIBLE DESCRIPTION BOX -->
<details class="bg-white border border-gray-300 rounded-lg shadow text-rcpch_dark_blue p-2 my-2"
       onmouseover="this.setAttribute('open', 'true')"
       onmouseout="this.removeAttribute('open')">
  <summary class="font-bold text-rcpch_dark_blue cursor-pointer">Description</summary>

  <!-- DESCRIPTION CONTENT -->
  <div class="mt-2">
    <p>{{ description }}</p>
  </div>

  <!-- KEYS -->
  <div class="flex justify-between items-center">
    <div class="flex flex-col my-2 gap-2">
      <p class="font-bold text-rcpch_dark_blue">Key</p>
      <div class="flex gap-4">
        <div class="flex gap-2 items-center">
          <i class="fa-solid fa-circle-check text-success"></i>
          <p>Complete</p>
        </div>
        <div class="flex gap-2 items-center">
          <i class="fa-solid fa-circle-exclamation text-error"></i>
          <p>Incomplete</p>
        </div>
        <div class="flex gap-2 items-center">
          <i class="fa-solid fa-ban text-muted"></i>
          <p>Not required</p>
        </div>
      </div>
    </div>
  </div>
</details>
