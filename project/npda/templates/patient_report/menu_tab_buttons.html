<div class="mb-4 flex gap-2 flex-wrap justify-between">
  <div>
    {% for value, label in table_categories %}
      <button
        hx-get="?category={{ value }}"
        hx-target="#table-area"
        hx-swap="innerHTML"
        class="btn
        {% if selected_category == value %}
        bg-rcpch_pink text-white
        {% else %}
        bg-rcpch_lightest_grey
        {% endif %}"
        >
        {{ label }}
      </button>
    {% endfor %}
  </div>
  <button name="submit-data"
    type="submit"
    class="btn bg-rcpch_lightest_grey"
    onclick="patient_report_modal.showModal()">
    <i class="fa-solid fa-download"></i>
    Download all as Excel
  </button>
</div>
