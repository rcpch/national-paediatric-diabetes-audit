{% extends "base.html" %}
{% load static %}
{% load npda_tags %}
{% block content %}
  <div class="text-center my-4">
    <h1 class="text-xl">Select your paediatric diabetes unit</h1>
  </div>
  <div class="flex flex-row flex-wrap justify-center gap-4 p-4">
    {% for pdu in pdu_choices %}
      <div class="card bg-base-100 w-96 shadow-xl">
        <div class="card-body">
          <h2 class="card-title">{{pdu.0}}</h2>
          <p>{{pdu.1}}</p>
          <div class="card-actions justify-end">
            <div>
              <button class="btn btn-primary">Upload data</button>
            </div>
            <div>
              <button class="btn btn-info">Unit Report</button>
              <button class="btn btn-info">Patient Report</button>
            </div>
          </div>
        </div>
      </div>
    {% endfor %}
  </div>
{% endblock %}
